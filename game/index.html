<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Flip</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Target 9:16 aspect ratio
        const WIDTH = 1080;
        const HEIGHT = 1920;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        // Scale to fit screen while maintaining aspect ratio
        function resize() {
            const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
            canvas.style.width = (WIDTH * scale) + 'px';
            canvas.style.height = (HEIGHT * scale) + 'px';
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State
        let score = 0;
        let stars = 0;
        let speed = 8;
        let gravity = 1; // 1 = down, -1 = up
        let gameOver = false;
        let frameCount = 0;
        
        const params = new URLSearchParams(window.location.search);
        const isDemo = params.get('demo') === '1';

        const player = {
            x: 200,
            y: HEIGHT / 2,
            radius: 40,
            vy: 0,
            targetY: HEIGHT - 100,
            accel: 2.5
        };

        let obstacles = [];
        let collectibles = [];

        function spawnObstacle() {
            const isTop = Math.random() > 0.5;
            const h = 150 + Math.random() * 200;
            obstacles.push({
                x: WIDTH,
                y: isTop ? 0 : HEIGHT - h,
                w: 80,
                h: h,
                isTop: isTop
            });
        }

        function spawnStar() {
            collectibles.push({
                x: WIDTH,
                y: 200 + Math.random() * (HEIGHT - 400),
                radius: 30,
                collected: false
            });
        }

        function update() {
            if (gameOver) return;

            frameCount++;
            speed += 0.001;

            // Player physics
            player.vy += gravity * player.accel;
            player.y += player.vy;

            // Constrain player
            if (player.y < player.radius) {
                player.y = player.radius;
                player.vy = 0;
            } else if (player.y > HEIGHT - player.radius) {
                player.y = HEIGHT - player.radius;
                player.vy = 0;
            }

            // Spawn
            if (frameCount % 60 === 0) spawnObstacle();
            if (frameCount % 100 === 0) spawnStar();

            // Move & Collide obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.x -= speed;

                // Collision
                if (
                    player.x + player.radius > o.x &&
                    player.x - player.radius < o.x + o.w &&
                    ((o.isTop && player.y - player.radius < o.h) ||
                     (!o.isTop && player.y + player.radius > o.y))
                ) {
                    if (!isDemo) gameOver = true;
                }

                if (o.x + o.w < 0) obstacles.splice(i, 1);
            }

            // Move & Collide stars
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const s = collectibles[i];
                s.x -= speed;

                const dx = player.x - s.x;
                const dy = player.y - s.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.radius + s.radius) {
                    stars++;
                    score += 50;
                    collectibles.splice(i, 1);
                } else if (s.x + s.radius < 0) {
                    collectibles.splice(i, 1);
                }
            }

            score += Math.floor(speed / 5);

            // AI Driver for Demo
            if (isDemo) {
                // Find next obstacle
                const nextO = obstacles.find(o => o.x > player.x - 50);
                if (nextO) {
                    const dist = nextO.x - player.x;
                    // If moving towards a collision on current side
                    if (dist < 300) {
                        if (nextO.isTop && gravity === -1) gravity = 1;
                        if (!nextO.isTop && gravity === 1) gravity = -1;
                    }
                }
                
                // If stuck on ceiling or floor with an obstacle coming
                // Just keep it simple: flip if obstacle is in the way
            }
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Draw grid for neon feel
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 2;
            for(let i=0; i<WIDTH; i+=100) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, HEIGHT); ctx.stroke();
            }
            for(let i=0; i<HEIGHT; i+=100) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WIDTH, i); ctx.stroke();
            }

            // Draw Player
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Obstacles
            ctx.shadowColor = '#f0f';
            ctx.fillStyle = '#f0f';
            obstacles.forEach(o => {
                ctx.fillRect(o.x, o.y, o.w, o.h);
                // Glow effect
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 4;
                ctx.strokeRect(o.x, o.y, o.w, o.h);
            });

            // Draw Stars
            ctx.shadowColor = '#ff0';
            ctx.fillStyle = '#ff0';
            collectibles.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // HUD
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 80px Courier New';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 50, 100);
            ctx.fillText(`STARS: ${stars}`, 50, 200);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.fillStyle = '#f0f';
                ctx.font = 'bold 120px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', WIDTH/2, HEIGHT/2);
                ctx.font = '60px Courier New';
                ctx.fillText('Tap to Restart', WIDTH/2, HEIGHT/2 + 100);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (gameOver) restart();
                else gravity *= -1;
            }
        });
        canvas.addEventListener('mousedown', () => {
            if (gameOver) restart();
            else gravity *= -1;
        });

        function restart() {
            score = 0;
            stars = 0;
            speed = 8;
            gravity = 1;
            gameOver = false;
            obstacles = [];
            collectibles = [];
            player.y = HEIGHT / 2;
            player.vy = 0;
        }

        loop();
    </script>
</body>
</html>
